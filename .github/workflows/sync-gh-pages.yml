name: Sync prototype to gh-pages

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/**'
      - '.github/workflows/sync-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gh-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync prototype into gh-pages
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.nojekyll' \
            prototype/ /tmp/gh-pages/

          touch /tmp/gh-pages/.nojekyll

          git -C /tmp/gh-pages config user.name "github-actions[bot]"
          git -C /tmp/gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gh-pages add -A

          if git -C /tmp/gh-pages diff --cached --quiet; then
            echo "gh-pages is already up to date."
            exit 0
          fi

          git -C /tmp/gh-pages commit -m "chore: sync prototype from main"
          git -C /tmp/gh-pages push origin HEAD:gh-pages
